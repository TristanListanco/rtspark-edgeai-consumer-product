; RT-Spark Edge AI consumer product (BCA182 Lab 4)
; Build:   pio run
; Upload:  pio run -t upload
; Monitor: pio device monitor

[platformio]
default_envs = rt_spark

[env:rt_spark]
platform = ststm32@20.0.0
; ststm32@20.0.0 defaults to GCC 7.2.1 (2017); pin the Arm GNU Toolchain 14.2.Rel1 explicitly
platform_packages = platformio/toolchain-gccarmnoneeabi@1.140201.0
framework = stm32cube
board = rt_spark
; Use our own include/stm32f4xx_hal_conf.h (8 MHz HSE, trimmed module list)
board_build.stm32cube.custom_config_header = yes

; Hard-float ABI for compile AND link (FreeRTOS ARM_CM4F port requires the FPU)
extra_scripts = pre:scripts/fpu.py

; FreeRTOS kernel is vendored in lib/FreeRTOS (V11.3.2); config in include/FreeRTOSConfig.h
lib_ldf_mode = chain+

upload_protocol = stlink
debug_tool = stlink
monitor_speed = 115200

build_flags =
    -Wall
    -Wextra
    -Wno-unused-parameter
    -Ilib/FreeRTOS/portable/GCC/ARM_CM4F
    -Wl,-Map,.pio/build/rt_spark/firmware.map
    -Wl,--print-memory-usage
    ; PlatformIO's generated linker script puts code+data in one segment (harmless on MCUs)
    -Wl,--no-warn-rwx-segments
